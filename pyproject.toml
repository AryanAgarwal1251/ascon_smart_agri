[build-system]
# Build backend: hatchling. Rationale: PEP 621-native, minimal, and installer-agnostic
# (works with plain `pip`/`python -m build` today, and `uv` can drive it later as the
# resolver via a uv.lock). This avoids gating CI on `uv` being installed while leaving
# that door open. See README "Tooling decisions".
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ascon-smart-agri"
version = "0.0.0"
description = "Federated GRU intrusion detection with Ascon-authenticated telemetry for smart-agriculture IoT (CICIoT2023)."
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Abhishek Jadli", email = "abhishek.jadli2023@vitstudent.ac.in" },
    { name = "Aryan Agarwal", email = "aryan.agarwal2023@vitstudent.ac.in" },
    { name = "Advait Amit Malviya", email = "advaitamit.malviya2023@vitstudent.ac.in" },
]
keywords = [
    "federated-learning",
    "intrusion-detection",
    "gru",
    "ascon",
    "authenticated-encryption",
    "smart-agriculture",
    "iot",
    "ciciot2023",
]
dependencies = [
    "torch>=2.2",
    "numpy>=1.26",
    "pandas>=2.1",
    "scikit-learn>=1.4",
    "scipy>=1.11",
    "safetensors>=0.4",   # structured tensor serialization for FedAvg (never pickle) -- III-F2
    "pydantic>=2.6",      # typed run configs (III-I4 manifest / configs), not raw dicts
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# KAT-GATED candidate. The widely-installed `ascon` package implements the pre-standard
# Ascon v1.2 variants (Ascon-128/128a), NOT necessarily NIST SP 800-232 Ascon-AEAD128.
# It is installed here as a *candidate only*; conformance is unverified until
# tests/test_ascon_kat.py passes against the official known-answer vectors (III-G1, R5).
# If it fails the KATs, the paper-consistent fallback (III-G1: "no primitive implemented
# from scratch") is to bind the official reference implementation -- NOT hand-roll one.
crypto = ["ascon>=1.3"]
dev = [
    "ruff>=0.6",
    "mypy>=1.10",
    "vulture==2.16",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pre-commit>=3.7",
    "pandas-stubs",
    "types-PyYAML",
]

[project.scripts]
asa = "ascon_smart_agri.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ascon_smart_agri"]

# --------------------------------------------------------------------------------------
# Ruff: linter + formatter (replaces black/isort/flake8).
# --------------------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "N",        # pep8-naming
    "UP",       # pyupgrade
    "B",        # flake8-bugbear
    "SIM",      # flake8-simplify
    "C4",       # flake8-comprehensions
    "RUF",      # ruff-specific
]
# N803/N806: single-capital math names (W_z, U_r, M_2, ...) match the paper's notation;
# allowed so code reads like Section III. E741 similarly (ambiguous names like `l`).
ignore = ["N803", "N806", "E741"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["N802"]
# The vulture whitelist marks names as "used" via bare attribute access; that is the idiom,
# not a mistake, so B018 (useless expression) does not apply here.
"vulture_whitelist.py" = ["B018"]

[tool.ruff.format]
docstring-code-format = true

# --------------------------------------------------------------------------------------
# mypy: strict-ish. Run over `src` (see CI). Crypto and federated boundary code are the
# ones that most need typing; third-party libs without stubs are ignored for imports.
# --------------------------------------------------------------------------------------
[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = [
    "torch.*",
    "ascon.*",
    "sklearn.*",
    "scipy.*",
    "safetensors.*",
    "yaml.*",
]
ignore_missing_imports = true

# --------------------------------------------------------------------------------------
# Vulture: dead-code detection. min_confidence=80 filters out the "defined-but-not-yet-
# called" stub functions/classes (confidence 60) during scaffolding while still catching
# unused imports (90) and unreachable code (100). vulture_whitelist.py documents the
# intentional false positives (PyTorch forward() overrides, pytest fixtures, etc.).
# --------------------------------------------------------------------------------------
[tool.vulture]
min_confidence = 80
paths = ["src", "vulture_whitelist.py"]

# --------------------------------------------------------------------------------------
# Pytest + coverage. The gating tests (leakage, nonce-collision, path-disjointness,
# Ascon-KAT) are first-class deliverables -- see the `gating` marker.
# --------------------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "src"]  # import `ascon_smart_agri` (src layout) and `configs` w/o install
addopts = "-ra --cov=ascon_smart_agri --cov-report=term-missing"
markers = [
    "gating: blocking correctness/security gate; a failure blocks downstream phases (III-J2/R3/R5/R6)",
]

[tool.coverage.run]
source = ["ascon_smart_agri"]
branch = true
