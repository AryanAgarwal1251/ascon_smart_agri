ont-family="Helvetica">append to this device's window buffer</text><rect x="305.273" y="1137" width="149.09" height="67.938" fill="#EEF4FC" style="stroke:#2A78D6;stroke-width:1;" rx="25" ry="25"/><text x="325.273" y="1179.277" fill="#000" font-size="24" textLength="109.09" font-family="Helvetica">buffering</text><ellipse cx="379.818" cy="1283.969" rx="22" ry="22" fill="none" style="stroke:#222;stroke-width:2;"/><ellipse cx="379.818" cy="1283.969" rx="12" ry="12" fill="#222" style="stroke:#222;stroke-width:2;"/><polygon points="214.93,1039.031,544.707,1039.031,568.707,1063.031,544.707,1087.031,214.93,1087.031,190.93,1063.031,214.93,1039.031" fill="#FDF6EC" style="stroke:#EB6834;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="387.818" y="1109.309" fill="#000" font-size="24" textLength="29.895" font-family="Helvetica">no</text><text x="214.93" y="1071.34" fill="#000" font-size="24" textLength="329.777" font-family="Helvetica">buffer has W = 16 records?</text><rect x="170.643" y="1389.969" width="418.352" height="67.938" fill="#EEF4FC" style="stroke:#2A78D6;stroke-width:1;" rx="25" ry="25"/><text x="190.643" y="1432.246" fill="#000" font-size="24" textLength="378.352" font-family="Helvetica">local GRU classifies the window</text><polygon points="286.801,1497.906,472.836,1497.906,496.836,1521.906,472.836,1545.906,286.801,1545.906,262.801,1521.906,286.801,1497.906" fill="#FDF6EC" style="stroke:#EB6834;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="286.801" y="1530.215" fill="#000" font-size="24" textLength="186.035" font-family="Helvetica">verdict benign?</text><text x="221.328" y="1516.246" fill="#000" font-size="24" textLength="41.473" font-family="Helvetica">yes</text><text x="496.836" y="1516.246" fill="#000" font-size="24" textLength="29.895" font-family="Helvetica">no</text><rect x="32" y="1565.906" width="362.055" height="67.938" fill="#EEF4FC" style="stroke:#2A78D6;stroke-width:1;" rx="25" ry="25"/><text x="52" y="1608.