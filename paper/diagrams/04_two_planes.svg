ll="#000" font-size="24" textLength="93.926" font-family="Helvetica">adapter</text></g><!--entity HO--><g class="entity" data-qualified-name="RP.HO" id="ent0009" data-source-line="27"><rect x="866.08" y="152.594" width="239.828" height="123.813" fill="#FFF" style="stroke:#52514E;stroke-width:1;" rx="5" ry="5"/><text x="886.08" y="194.871" fill="#000" font-size="24" textLength="160.793" font-family="Helvetica">Held-out split</text><text x="886.08" y="222.809" fill="#000" font-size="24" textLength="163.559" font-family="Helvetica">311,563 rows</text><text x="886.08" y="250.746" fill="#000" font-size="24" textLength="199.828" font-family="Helvetica">never trained on</text></g><!--entity WB--><g class="entity" data-qualified-name="RP.WB" id="ent0010" data-source-line="28"><rect x="578.2" y="662.234" width="263.594" height="95.875" fill="#FFF" style="stroke:#52514E;stroke-width:1;" rx="5" ry="5"/><text x="598.2" y="704.511" fill="#000" font-size="24" textLength="174.762" font-family="Helvetica">Window buffer</text><text x="598.2" y="732.449" fill="#000" font-size="24" textLength="223.594" font-family="Helvetica">W = 16 per device</text></g><!--entity V--><g class="entity" data-qualified-name="RP.V" id="ent0011" data-source-line="29"><rect x="533.22" y="968.014" width="125.559" height="67.938" fill="#FFF" style="stroke:#52514E;stroke-width:1;" rx="5" ry="5"/><text x="553.22" y="1010.291" fill="#000" font-size="24" textLength="85.559" font-family="Helvetica">Verdict</text></g><g class="entity" data-qualified-name="GMN21" id="ent0022" data-source-line="44"><path d="M1323.08,644.294 L1323.08,776.044 A0,0 0 0 0 1323.08,776.044 L2020.92,776.044 A0,0 0 0 0 2020.92,776.044 L2020.92,664.294 L2000.92,644.294 L1433.02,644.294 L930.02,513.594 L1417.02,644.294 L1323.08,644.294 A0,0 0 0 0 1323.08,644.294" style="stroke:#EB6834;stroke-width:1;" fill="#FDF6EC"/><path d="M2000.92,644.294 L2000.92,664.294 L2020.92,664.294 L2000.92,644.294" style="stroke:#EB6834;stroke-width:1;" fill="#FDF6EC"/><text x="1335.08" y="676.571" fill="#000" font-size="24" textLength="195.902" font-weight="700" font-family="Helvetica">The boundary.</text><text x="1538.611" y="676.571" fill="#000" font-size="24" textLength="452.309" font-family="Helvetica">The GRU never sees the sensor JSON.</text><text x="1335.08" y="704.509" fill="#000" font-size="24" textLength="511.887" font-family="Helvetica">It classifies a held-out flow-derived record.</text><text x="1335.08" y="732.446" fill="#000" font-size="24" textLength="538.852" font-family="Helvetica">This demonstrates architectural correctness,</text><text x="1335.08" y="760.384" fill="#000" font-size="24" textLength="45.047" font-weight="700" font-family="Helvetica">not</text><text x="1387.756" y="760.384" fill="#000" font-size="24" textLength="350.836" font-family="Helvetica">detection on live farm traffic.</text></g><!--link TR to DP--><g class="link" data-entity-1="ent0002" data-entity-2="ent0003" id="lnk12" data-source-line="32" data-link-type="dependency"><path d="M244,263.434 C244,309.594 244,369.654 244,415.714" style="stroke:#52514E;stroke-width:2;" fill="none" id="TR-to-DP"/><polygon points="244,425.714,252,407.714,244,415.714,236,407.714,244,425.714" fill="#52514E" style="stroke:#52514E;stroke-width:2;stroke-linejoin:miter;stroke-miterlimit:10;"/></g><!--link DP to LG--><g class="link" data-entity-1="ent0003" data-entity-2="ent0004" id="lnk13" data-source-line="33" data-link-type="dependency"><path d="M244.8,523.254 C245.6,568.514 246.589,625.815 247.269,665.515" style="stroke:#52514E;stroke-width:2;" fill="none" id="DP-to-LG"/><polygon points="247.44,675.514,255.131,657.379,247.269,665.515,239.133,657.653,247.44,675.514" fill="#52514E" style="stroke:#52514E;stroke-width:2;stroke-linejoin:miter;stroke-miterlimit:10;"/></g><!--link LG to MG--><g class="link" data-entity-1="ent0004" data-entity-2="ent0005" id="lnk14" data-source-line="34" data-link-type="dependency"><path d="M211.221,752.699 C191.721,776.119 174.52,8