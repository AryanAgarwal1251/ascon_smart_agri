# Phase 9 "generalised" configuration: default.yaml with one change -- feature selection runs
# over the cross-corpus intersection (features.candidate_columns), so the model it produces can
# be evaluated on, and federated with, every training corpus. Everything else is identical,
# which makes a run with this config the ablation "what does restricting to the intersection
# cost on CICIoT2023?" against the same run with default.yaml.
#
# Intersection as of 2026-09-22, over the TRAINING corpora (data/datasets.py:TRAINING_CORPORA
# = CICIoT2023 + CICIoMT2024): both supply all 39 canonical columns (CICIoMT2024 via the
# `Duration -> Time_To_Live` alias), so the candidate set is the full vocabulary and all 16
# Phase 2 features are available. `Drate` is zero-variance in both and is not canonical.
#
# History: the 2026-09-21 run included Edge-IIoTset, whose packet windows supply only 18 of
# these; the intersection was then 17 candidates (no Header_Length, IAT, Time_To_Live, and
# `Number` left out as a testbed marker) and Stage 2 collapsed it to F = 13. That corpus is
# now registered `not_for_training` (see datasets.py for the measured reasons), which is what
# gives the three features back. The 17-column record is artifacts/manifest_phase9_generalised.json.
#
# STATED EXPECTATION (Section III-I5): published CICIoT2023 results routinely exceed
# 98-99% accuracy. That is a known artifact of the dataset's imbalance (IR ~ 5751) and the
# separability of flooding classes -- NOT evidence of a good model. Read macro-F1 on the
# rare families and the false-positive rate instead. This note is committed here, before
# any experiment runs, to guard against post-hoc rationalisation.

run_name: generalised
output_dir: artifacts

data:
  dataset_root: data/ciciot2023_raw   # official UNB raw distribution, not the Kaggle mirror
                                       # (see ascon_smart_agri.data.subsample docstring)
  subsample_target: 1800000       # M ~ 1.5-2e6 (III-B1)
  per_class_cap: 70000            # compress DDoS, keep rare families -- calibrated to land
                                   # near M ~ 1.5-2e6 on the raw distribution (III-B1)
  chunk_size: 500000
  block_size: 256                 # split on contiguous blocks, not rows (III-B3)
  test_fraction: 0.2
  seed: 0

features:
  correlation_tau: 0.95           # Stage 2 Spearman prune (III-C)
  f_sweep: [8, 12, 16, 24]        # + F0, Stage 4 knee
  selected_f: 16
  rf_n_estimators: 200
  rrf_k: 60                       # Stage-3 reciprocal rank fusion constant (see selection.py)
  selection_sample_size: 200000   # seeded sample for Spearman/MI/RF stats; null = all rows
  candidate_columns:              # Stage 0: the cross-corpus intersection (see header)
    - Header_Length
    - Protocol Type
    - Time_To_Live
    - Rate
    - fin_flag_number
    - syn_flag_number
    - rst_flag_number
    - psh_flag_number
    - ack_flag_number
    - ece_flag_number
    - cwr_flag_number
    - ack_count
    - syn_count
    - fin_count
    - rst_count
    - HTTP
    - HTTPS
    - DNS
    - Telnet
    - SMTP
    - SSH
    - IRC
    - TCP
    - UDP
    - DHCP
    - ARP
    - ICMP
    - IGMP
    - IPv
    - LLC
    - Tot sum
    - Min
    - Max
    - AVG
    - Std
    - Tot size
    - IAT
    - Number
    - Variance

sequence:
  window: 16                      # W; y_i = y_{i+W-1} (III-D)
  window_packets: 10              # packets per window when re-aggregating Edge-IIoTset
  w_sweep: [1, 8, 16, 32]         # W=1 = "does recurrence help?" ablation

model:
  n_features: 16                  # F
  hidden_size: 96                 # H
  n_classes: 8                    # C -> Eq. (19) = 33,800 params

federated:
  n_clients: 3                    # K (A1)
  dirichlet_alpha: 0.5            # Eq. (20)
  alpha_sweep: [0.1, 0.5, 100.0]
  rounds: 20                      # R
  local_epochs: 3                 # E
  e_sweep: [1, 3, 5]
  aggregation: weighted           # or "unweighted" (ablation)
  fedprox_mu: null                # set a float to enable the FedProx R4 fallback

crypto:
  key_bits: 128
  nonce_bits: 128
  tag_bits: 128
  ad_fields: [edge_id, device_id, counter, schema_version]  # Eq. (27)

telemetry:
  device_ids: [soil01, soil02, soil03]
  messages_per_stream: 100
  schema_version: v1
  temperature_range_c: [15.0, 35.0]
  soil_moisture_range_pct: [0.0, 100.0]
  seed: 0

evaluation:
  seeds: [0, 1, 2]                # >= 3 (III-I4)
  near_ceiling_accuracy: 0.98     # triggers the III-I5 note
